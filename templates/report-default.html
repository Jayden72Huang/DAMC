<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAMC 评估報告 — Sakura Print Edition</title>
<meta property="og:title" content="DAMC AI時代価値評估報告">
<meta property="og:description" content="Sakura Chroma — 暖色印刷風">
<meta name="description" content="DAMC 評估報告 — AI時代個人価値自動評估 · Sakura Print Edition">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1E6CB;
    --paper-dk: #E5D6B0;
    --ink: #3A2516;
    --ink-light: rgba(58,37,22,0.55);
    --ink-faint: rgba(58,37,22,0.12);
    --ink-border: rgba(58,37,22,0.25);
    --color-d: #3F8BC4;
    --color-a: #E5392A;
    --color-m: #3D9F47;
    --color-c: #F0BC2A;
    --color-d-dim: rgba(63,139,196,0.15);
    --color-a-dim: rgba(229,57,42,0.15);
    --color-m-dim: rgba(61,159,71,0.15);
    --color-c-dim: rgba(240,188,42,0.15);
    --pink: #E54489;
    --orange: #F09131;
    --red-stamp: #E5392A;
    --font-display: 'Big Shoulders Display', 'Impact', sans-serif;
    --font-body: 'Albert Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
    --border-w: 1.5px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* Halftone dot texture overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(58,37,22,0.55) 1px, transparent 1.6px);
    background-size: 4px 4px;
    opacity: 0.12;
    pointer-events: none;
    z-index: 9999;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 28px 80px;
    position: relative;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: var(--border-w) solid var(--ink);
    position: relative;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header-left {
    text-align: left;
  }
  .header h1 {
    font-family: var(--font-display);
    font-size: 80px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 0.9;
    color: var(--ink);
    text-transform: uppercase;
  }
  .header .subtitle {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    opacity: 0.6;
    margin-top: 8px;
  }
  .header .date-line {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
    opacity: 0.5;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* Starburst Seal Badge */
  .starburst {
    width: 110px;
    height: 110px;
    position: relative;
    flex-shrink: 0;
  }
  .starburst-bg {
    width: 100%;
    height: 100%;
    background: var(--ink);
    clip-path: polygon(50% 0%, 60% 8%, 73% 4%, 76% 17%, 89% 18%, 87% 31%, 100% 35%, 92% 47%, 100% 60%, 87% 64%, 90% 77%, 76% 78%, 75% 91%, 62% 88%, 53% 100%, 42% 90%, 30% 96%, 25% 84%, 12% 86%, 13% 73%, 0% 70%, 7% 58%, 0% 47%, 11% 39%, 4% 27%, 17% 25%, 13% 12%, 27% 14%, 25% 1%, 38% 7%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .starburst-inner {
    width: 80%;
    height: 80%;
    background: var(--paper);
    clip-path: polygon(50% 0%, 60% 8%, 73% 4%, 76% 17%, 89% 18%, 87% 31%, 100% 35%, 92% 47%, 100% 60%, 87% 64%, 90% 77%, 76% 78%, 75% 91%, 62% 88%, 53% 100%, 42% 90%, 30% 96%, 25% 84%, 12% 86%, 13% 73%, 0% 70%, 7% 58%, 0% 47%, 11% 39%, 4% 27%, 17% 25%, 13% 12%, 27% 14%, 25% 1%, 38% 7%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .starburst-grade {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
  }
  .starburst-label {
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.6;
    margin-top: 2px;
  }

  /* ===== ARCHETYPE HERO ===== */
  .archetype {
    position: relative;
    margin-bottom: 48px;
    padding: 48px 36px 40px;
    border: var(--border-w) solid var(--ink);
    overflow: hidden;
    background: var(--paper);
  }

  /* Diagonal stripe ribbons */
  .archetype-ribbons {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.12;
  }
  .ribbon {
    position: absolute;
    height: 20px;
    width: 160%;
    left: -30%;
    transform-origin: center center;
  }
  .ribbon-1 { background: var(--color-d); top: 15%; transform: rotate(-12deg); }
  .ribbon-2 { background: var(--color-a); top: 35%; transform: rotate(-12deg); }
  .ribbon-3 { background: var(--color-m); top: 55%; transform: rotate(-12deg); }
  .ribbon-4 { background: var(--color-c); top: 75%; transform: rotate(-12deg); }
  .ribbon-5 { background: var(--pink); top: 90%; transform: rotate(-12deg); height: 14px; }

  .archetype-content {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  .archetype .emoji {
    font-size: 64px;
    display: block;
    margin-bottom: 12px;
  }
  .archetype .name {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.1;
  }
  .archetype .tagline {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    opacity: 0.7;
    max-width: 520px;
    margin: 0 auto 24px;
    line-height: 1.6;
  }

  .hero-stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .overall-score {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .overall-score .number {
    font-family: var(--font-display);
    font-size: 88px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    color: var(--ink);
  }
  .overall-score .unit {
    font-family: var(--font-mono);
    font-size: 20px;
    color: var(--ink);
    opacity: 0.4;
  }

  /* Red stamp badge */
  .stamp-badge {
    display: inline-block;
    background: var(--red-stamp);
    color: var(--paper);
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 18px;
    transform: rotate(-3deg);
    border: 2px solid var(--red-stamp);
    line-height: 1;
  }

  /* ===== SECTION HEADERS ===== */
  .section-header {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink);
    padding-bottom: 10px;
    border-bottom: var(--border-w) solid var(--ink);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    opacity: 0.4;
    letter-spacing: 1px;
  }

  /* ===== RADAR CHART ===== */
  .radar-section {
    margin-bottom: 48px;
    display: flex;
    justify-content: center;
    padding: 32px 0;
  }
  .radar-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .radar-label {
    position: absolute;
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .radar-label .score {
    display: block;
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-top: 2px;
  }
  .radar-label-d { top: -12px; left: 50%; transform: translateX(-50%); text-align: center; color: var(--color-d); }
  .radar-label-a { top: 50%; right: -65px; transform: translateY(-50%); text-align: left; color: var(--color-a); }
  .radar-label-m { bottom: -12px; left: 50%; transform: translateX(-50%); text-align: center; color: var(--color-m); }
  .radar-label-c { top: 50%; left: -60px; transform: translateY(-50%); text-align: right; color: var(--color-c); }

  /* ===== DIMENSION CARDS ===== */
  .scores-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 48px;
  }
  .score-card {
    border: var(--border-w) solid var(--ink);
    background: var(--paper);
    padding: 0;
    position: relative;
    transition: box-shadow 0.2s;
  }
  .score-card:hover {
    box-shadow: 3px 3px 0 var(--ink);
  }
  .score-card .card-top-strip {
    height: 8px;
    width: 100%;
  }
  .score-card .card-body {
    padding: 20px 22px 22px;
  }
  .score-card .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .score-card .dim-letter {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
  }
  .score-card .dim-score {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
  }
  .score-card .dim-name {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
    opacity: 0.55;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* Sub-score bars */
  .sub-score {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .sub-score .sub-label {
    width: 80px;
    flex-shrink: 0;
    font-family: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    opacity: 0.65;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 12px;
  }
  .sub-score .bar-track {
    flex: 1;
    height: 8px;
    background: rgba(58,37,22,0.1);
    border-radius: 0;
    overflow: hidden;
    border: 1px solid rgba(58,37,22,0.15);
  }
  .sub-score .bar-fill {
    height: 100%;
    border-radius: 0;
    transition: width 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    width: var(--bar-width, 0%);
  }
  .sub-score .sub-val {
    width: 32px;
    text-align: right;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12px;
    flex-shrink: 0;
  }

  /* Card color variants */
  .card-d .card-top-strip { background: var(--color-d); }
  .card-d .dim-letter, .card-d .dim-score { color: var(--color-d); }
  .card-d .bar-fill { background: var(--color-d); }
  .card-d .sub-val { color: var(--color-d); }

  .card-a .card-top-strip { background: var(--color-a); }
  .card-a .dim-letter, .card-a .dim-score { color: var(--color-a); }
  .card-a .bar-fill { background: var(--color-a); }
  .card-a .sub-val { color: var(--color-a); }

  .card-m .card-top-strip { background: var(--color-m); }
  .card-m .dim-letter, .card-m .dim-score { color: var(--color-m); }
  .card-m .bar-fill { background: var(--color-m); }
  .card-m .sub-val { color: var(--color-m); }

  .card-c .card-top-strip { background: var(--color-c); }
  .card-c .dim-letter, .card-c .dim-score { color: var(--color-c); }
  .card-c .bar-fill { background: var(--color-c); }
  .card-c .sub-val { color: var(--color-c); }

  /* ===== SCAN EVIDENCE ===== */
  .scan-evidence {
    margin-bottom: 48px;
  }
  .evidence-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: var(--border-w) solid var(--ink);
  }
  .evidence-item {
    padding: 18px 14px;
    text-align: center;
    border-right: 1px solid rgba(58,37,22,0.2);
    border-bottom: 1px solid rgba(58,37,22,0.2);
    background: var(--paper);
    position: relative;
  }
  .evidence-item:nth-child(4n) { border-right: none; }
  .evidence-item:nth-last-child(-n+4) { border-bottom: none; }
  .evidence-item .ev-check {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 10px;
    color: var(--color-m);
  }
  .evidence-item .ev-value {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--ink);
    line-height: 1.1;
  }
  .evidence-item .ev-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink);
    opacity: 0.5;
    margin-top: 4px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  /* ===== INSIGHTS ===== */
  .insights {
    margin-bottom: 48px;
  }
  .insight-group {
    border: var(--border-w) solid var(--ink);
    padding: 24px 28px;
    margin-bottom: 16px;
    background: var(--paper);
    position: relative;
  }
  .insight-group h3 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
  }
  .insight-group ul {
    list-style: none;
    padding: 0;
  }
  .insight-group li {
    padding: 8px 0;
    padding-left: 22px;
    position: relative;
    color: var(--ink);
    opacity: 0.75;
    font-size: 14px;
    line-height: 1.7;
    font-weight: 400;
  }
  .insight-group li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 15px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .insight-group.distill li::before { background: var(--color-d); }
  .insight-group.moat li::before { background: var(--color-a); }
  .insight-group.risk li::before { background: var(--orange); }
  .insight-group.action li::before { background: var(--color-m); }
  .insight-group.action li {
    opacity: 1;
    font-weight: 600;
  }

  /* ===== PERCENTILE ===== */
  .percentile-section {
    margin-bottom: 48px;
    border: var(--border-w) solid var(--ink);
    text-align: center;
    padding: 36px 28px;
    background: var(--paper);
    position: relative;
  }
  .percentile-section .pct-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--ink);
    opacity: 0.5;
    margin-bottom: 16px;
  }
  .percentile-section .pct-overall {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -2px;
    color: var(--ink);
    line-height: 1;
  }
  .percentile-section .pct-sublabel {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    opacity: 0.5;
    margin-top: 6px;
    margin-bottom: 28px;
  }
  .pct-dims {
    display: flex;
    justify-content: center;
    gap: 40px;
  }
  .pct-dim {
    text-align: center;
  }
  .pct-dim .pct-dim-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.45;
    margin-bottom: 4px;
  }
  .pct-dim .pct-dim-val {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -1px;
  }

  /* ===== SHARE CARD ===== */
  .share-section {
    margin-bottom: 48px;
    border: var(--border-w) solid var(--ink);
    padding: 32px 28px;
    text-align: center;
    background: var(--paper-dk);
  }
  .share-section .share-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .share-section .qr-img {
    width: 120px;
    height: 120px;
    margin: 0 auto 16px;
    border: var(--border-w) solid var(--ink);
    padding: 8px;
    background: #fff;
  }
  .share-section .qr-img img {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .share-section .qr-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink);
    opacity: 0.5;
    margin-bottom: 20px;
  }
  #share-btn {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 14px 36px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #share-btn:hover {
    box-shadow: 3px 3px 0 var(--color-a);
    transform: translate(-1px, -1px);
  }
  #share-btn:active {
    box-shadow: none;
    transform: translate(0, 0);
  }
  #download-btn {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: transparent;
    color: var(--ink);
    border: var(--border-w) solid var(--ink);
    padding: 10px 28px;
    cursor: pointer;
    margin-left: 12px;
    transition: all 0.15s;
  }
  #download-btn:hover {
    background: var(--ink);
    color: var(--paper);
  }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center;
    padding-top: 24px;
    border-top: var(--border-w) solid var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink);
    opacity: 0.45;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .footer .footer-line {
    margin-bottom: 4px;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in {
    animation: fadeUp 0.5s ease-out both;
  }
  .delay-1 { animation-delay: 0.08s; }
  .delay-2 { animation-delay: 0.16s; }
  .delay-3 { animation-delay: 0.24s; }
  .delay-4 { animation-delay: 0.32s; }
  .delay-5 { animation-delay: 0.40s; }
  .delay-6 { animation-delay: 0.48s; }
  .delay-7 { animation-delay: 0.56s; }
  .delay-8 { animation-delay: 0.64s; }

  /* Bars animate via JS setting --bar-width */
  .bar-fill {
    transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .container { padding: 24px 14px 60px; }
    .header h1 { font-size: 52px; }
    .header-top { flex-direction: column; align-items: center; gap: 16px; }
    .header-left { text-align: center; }
    .starburst { width: 80px; height: 80px; }
    .starburst-grade { font-size: 30px; }
    .archetype .emoji { font-size: 48px; }
    .archetype .name { font-size: 30px; }
    .overall-score .number { font-size: 60px; }
    .hero-stats { gap: 20px; }
    .scores-grid { grid-template-columns: 1fr; }
    .evidence-grid { grid-template-columns: repeat(2, 1fr); }
    .evidence-item:nth-child(2n) { border-right: none; }
    .evidence-item:nth-child(4n) { border-right: 1px solid rgba(58,37,22,0.2); }
    .evidence-item:nth-last-child(-n+4) { border-bottom: 1px solid rgba(58,37,22,0.2); }
    .evidence-item:nth-last-child(-n+2) { border-bottom: none; }
    .radar-wrapper { width: 260px; height: 260px; }
    .radar-label-a { right: -50px; }
    .radar-label-c { left: -50px; }
    .pct-dims { gap: 20px; flex-wrap: wrap; }

  /* ===== PRINT ===== */

    .container { padding: 24px; }
    .score-card:hover { box-shadow: none; }
    #share-btn, #download-btn { display: none; }
  }
</style>
</head>
<body>

<div class="container">

<script>
// ===== DATA INJECTION POINT =====
window.DAMC_DATA = {
  userName: "AI 产品/创业者",
  date: "2026-05-25",
  mbti: "INFJ",
  archetype: { name: "AI 架构师", emoji: "🏆", tagline: "你站在 AI 时代的食物链顶端 — 有料、不可替代、还会用 AI" },
  overall: 83,
  scores: {
    D: { total: 83, subs: { expertise: 82, methodology: 85, codifiability: 92, standardization: 72, demand: 88 } },
    A: { total: 75, subs: { creativity: 72, eq: 78, crossDomain: 80, ambiguity: 76, physical: 45, trust: 72 } },
    M: { total: 92, subs: { environment: 17, skills: 25, automation: 20, memory: 13, advanced: 17 } },
    C: { total: 83, fit: "AI-Augmented Visionary", paths: ["AI 产品战略顾问", "Skill 生态构建者", "AI 创业导师"] }
  },
  percentiles: { D: 96, A: 91, M: 99, C: 98, overall: 99 },
  insights: {
    distillTargets: ["87个自建 Skill 覆盖11个领域的「AI 产品方法论」可蒸馏为完整 AI 创业 Skill 套件", "CLAUDE.md 中14条自定义规则可编码为标准化团队协作 Skill", "11个领域的工具链编排经验可蒸馏为「全栈 AI 运营」方法论"],
    moats: ["跨11个领域的系统性整合能力", "INFJ 特质驱动的产品直觉与用户同理心", "172个 skill 构成的「AI 协作肌肉记忆」"],
    risks: ["身体在场评分偏低（45/100），限制线下高价值机会", "11个领域广度需警惕样样通样样松"],
    actions: ["30天：蒸馏3个核心工作流为开源 Skill", "60天：选1个垂直领域发布深度案例研究", "90天：组织2次线下 AI 工作坊"]
  },
  scanSummary: { totalSkills: 172, customSkills: 87, hooksCount: 6, mcpServers: 8, memoryFiles: 32, claudeMdLines: 81, aiCommits: 204, totalCommits: 320 }
};
// ===== END DATA =====

(function() {
  var D = window.DAMC_DATA;
  if (!D) return;

  // Helpers
  function getGrade(score) {
    if (score >= 90) return { grade: 'S', color: 'var(--color-m)' };
    if (score >= 75) return { grade: 'A', color: 'var(--color-d)' };
    if (score >= 60) return { grade: 'B', color: 'var(--color-c)' };
    if (score >= 45) return { grade: 'C', color: 'var(--orange)' };
    if (score >= 30) return { grade: 'D', color: 'var(--color-a)' };
    return { grade: 'F', color: 'var(--color-a)' };
  }

  // Header
  var dateLine = D.userName + (D.mbti ? ' // ' + D.mbti : '') + ' // ' + D.date;
  document.getElementById('date-line').textContent = dateLine;

  // Grade seal
  var gradeInfo = getGrade(D.overall);
  document.getElementById('seal-grade').textContent = gradeInfo.grade;

  // Archetype
  document.getElementById('arch-emoji').textContent = D.archetype.emoji;
  document.getElementById('arch-name').textContent = D.archetype.name;
  document.getElementById('arch-tagline').textContent = D.archetype.tagline;
  document.getElementById('overall-num').textContent = D.overall;

  // Stamp badge — percentile
  var pct = D.percentiles || {};
  if (pct.overall) {
    document.getElementById('stamp-badge').textContent = 'TOP ' + (100 - pct.overall) + '%';
  }

  // Radar labels
  document.getElementById('rl-d').textContent = D.scores.D.total;
  document.getElementById('rl-a').textContent = D.scores.A.total;
  document.getElementById('rl-m').textContent = D.scores.M.total;
  document.getElementById('rl-c').textContent = D.scores.C.total;

  // Draw radar
  drawRadar(D.scores.D.total, D.scores.A.total, D.scores.M.total, D.scores.C.total);

  // Score cards
  var grid = document.getElementById('scores-grid');
  var dims = [
    { key: 'D', letter: 'D', label: 'DISTILL', name: '蒸馏价值', cls: 'card-d', color: 'var(--color-d)',
      subLabels: { expertise: '领域专精', methodology: '方法论', codifiability: '可编码性', standardization: '标准化', demand: '市场需求' } },
    { key: 'A', letter: 'A', label: 'ANTI', name: '抗蒸馏指数', cls: 'card-a', color: 'var(--color-a)',
      subLabels: { creativity: '创造力', eq: '情商', crossDomain: '跨域综合', ambiguity: '模糊决策', physical: '身体在场', trust: '信任资产' } },
    { key: 'M', letter: 'M', label: 'MASTERY', name: 'AI 驾驭能力', cls: 'card-m', color: 'var(--color-m)',
      subLabels: { environment: '环境配置', skills: 'Skill生态', automation: '自动化集成', memory: '记忆系统', advanced: '高级功能' } },
    { key: 'C', letter: 'C', label: 'COMPASS', name: '职业适配', cls: 'card-c', color: 'var(--color-c)',
      subLabels: {} }
  ];

  dims.forEach(function(dim, i) {
    var data = D.scores[dim.key];
    var card = document.createElement('div');
    card.className = 'score-card ' + dim.cls + ' animate-in delay-' + (i + 3);

    var subsHTML = '';
    var subs = data.subs || {};
    var maxSub = dim.key === 'M' ? 25 : 100;
    Object.keys(subs).forEach(function(k) {
      var label = dim.subLabels[k] || k;
      var val = subs[k];
      var pctVal = dim.key === 'M' ? Math.min(100, (val / maxSub) * 100) : val;
      subsHTML += '<div class="sub-score"><span class="sub-label" title="' + label + '">' + label + '</span><div class="bar-track"><div class="bar-fill" style="--bar-width:' + pctVal + '%;width:0%;" data-width="' + pctVal + '"></div></div><span class="sub-val">' + val + '</span></div>';
    });

    // C dimension: career paths
    if (dim.key === 'C' && data.fit) {
      subsHTML = '<div style="margin-top:4px;"><div style="font-size:13px;color:var(--ink);opacity:0.6;margin-bottom:10px;">适配方向: <strong style="opacity:1">' + data.fit + '</strong></div>';
      if (data.paths) {
        data.paths.forEach(function(p) {
          subsHTML += '<div style="font-size:13px;color:var(--ink);opacity:0.7;padding:5px 0;padding-left:18px;position:relative;font-family:var(--font-body);"><span style="position:absolute;left:0;color:var(--color-c);font-weight:700;">→</span> ' + p + '</div>';
        });
      }
      subsHTML += '</div>';
    }

    card.innerHTML = '<div class="card-top-strip"></div><div class="card-body"><div class="card-header"><div><span class="dim-letter">' + dim.letter + '</span></div><span class="dim-score">' + data.total + '</span></div><div class="dim-name">' + dim.label + ' — ' + dim.name + '</div>' + subsHTML + '</div>';
    grid.appendChild(card);
  });

  // Scan evidence
  var evGrid = document.getElementById('evidence-grid');
  var evItems = [
    { key: 'totalSkills', label: 'Skills 总数' },
    { key: 'customSkills', label: '自建 Skills' },
    { key: 'hooksCount', label: 'Hooks 配置' },
    { key: 'mcpServers', label: 'MCP 服务器' },
    { key: 'memoryFiles', label: '记忆文件' },
    { key: 'claudeMdLines', label: 'CLAUDE.MD 行数' },
    { key: 'aiCommits', label: 'AI 协作提交' },
    { key: 'totalCommits', label: '总提交数' }
  ];
  var scan = D.scanSummary || {};
  evItems.forEach(function(item) {
    var val = scan[item.key];
    if (val === undefined || val === null) return;
    var el = document.createElement('div');
    el.className = 'evidence-item';
    el.innerHTML = '<div class="ev-check">■</div><div class="ev-value">' + val + '</div><div class="ev-label">' + item.label + '</div>';
    evGrid.appendChild(el);
  });

  // Insights
  var insContent = document.getElementById('insights-content');
  var ins = D.insights || {};
  var groups = [
    { key: 'distillTargets', title: '值得蒸馏的能力', icon: '🧬', cls: 'distill' },
    { key: 'moats', title: '你的护城河', icon: '🏰', cls: 'moat' },
    { key: 'risks', title: '风险预警', icon: '⚠️', cls: 'risk' },
    { key: 'actions', title: '行动建议', icon: '🚀', cls: 'action' }
  ];
  groups.forEach(function(g) {
    var items = ins[g.key];
    if (!items || items.length === 0) return;
    var div = document.createElement('div');
    div.className = 'insight-group ' + g.cls;
    div.innerHTML = '<h3>' + g.icon + ' ' + g.title + '</h3><ul>' + items.map(function(item) { return '<li>' + item + '</li>'; }).join('') + '</ul>';
    insContent.appendChild(div);
  });

  // Percentiles
  if (pct.overall) {
    document.getElementById('pct-overall').textContent = 'Top ' + (100 - pct.overall) + '%';
    document.getElementById('pct-label').textContent = 'of AI-era professionals globally';
    var pctDimsEl = document.getElementById('pct-dims');
    var dimColors = { D: 'var(--color-d)', A: 'var(--color-a)', M: 'var(--color-m)', C: 'var(--color-c)' };
    var dimNames = { D: 'Distill', A: 'Anti', M: 'Mastery', C: 'Compass' };
    ['D','A','M','C'].forEach(function(k) {
      if (!pct[k]) return;
      var el = document.createElement('div');
      el.className = 'pct-dim';
      el.innerHTML = '<div class="pct-dim-label">' + dimNames[k] + '</div><div class="pct-dim-val" style="color:' + dimColors[k] + ';">' + pct[k] + '%</div>';
      pctDimsEl.appendChild(el);
    });
  } else {
    document.getElementById('percentile-section').style.display = 'none';
  }

  // Share button
  var shareBtn = document.getElementById('share-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', function() {
      var arch = D.archetype;
      var bar = function(v) { var filled = Math.round(v/10); return '█'.repeat(filled) + '░'.repeat(10-filled); };
      var text = [
        arch.emoji + ' ' + arch.name + ' — DAMC AI Era Assessment',
        '',
        'D ' + bar(D.scores.D.total) + ' ' + D.scores.D.total,
        'A ' + bar(D.scores.A.total) + ' ' + D.scores.A.total,
        'M ' + bar(D.scores.M.total) + ' ' + D.scores.M.total,
        'C ' + bar(D.scores.C.total) + ' ' + D.scores.C.total,
        '',
        'Overall: ' + D.overall + '/100 · Grade ' + gradeInfo.grade,
        pct.overall ? 'Top ' + (100 - pct.overall) + '% of AI-era builders' : '',
        '',
        'Know your worth → github.com/Jayden72Huang/DAMC',
        '#DAMC #AIEra #KnowYourWorth'
      ].filter(Boolean).join('\n');
      navigator.clipboard.writeText(text).then(function() {
        shareBtn.textContent = 'Copied!';
        setTimeout(function() { shareBtn.textContent = 'Copy Share Card'; }, 2000);
      });
    });
  }

  // Download button (print)
  var downloadBtn = document.getElementById('download-btn');
  if (downloadBtn) {
    downloadBtn.addEventListener('click', function() {
      window.print();
    });
  }

  // Footer date
  document.getElementById('gen-date').textContent = D.date;

  // Animate bars after a short delay
  setTimeout(function() {
    document.querySelectorAll('.bar-fill').forEach(function(bar) {
      bar.style.width = bar.dataset.width + '%';
    });
  }, 600);

})();

function drawRadar(d, a, m, c) {
  var svg = document.getElementById('radar');
  var cx = 150, cy = 150, r = 110;

  // Grid lines — ink brown on cream
  var gridHTML = '';
  [0.25, 0.5, 0.75, 1].forEach(function(scale) {
    var rr = r * scale;
    var points = [
      [cx, cy - rr],
      [cx + rr, cy],
      [cx, cy + rr],
      [cx - rr, cy]
    ].map(function(p) { return p.join(','); }).join(' ');
    gridHTML += '<polygon points="' + points + '" fill="none" stroke="rgba(58,37,22,0.15)" stroke-width="1"/>';
  });

  // Axes
  gridHTML += '<line x1="' + cx + '" y1="' + (cy - r) + '" x2="' + cx + '" y2="' + (cy + r) + '" stroke="rgba(58,37,22,0.15)" stroke-width="1"/>';
  gridHTML += '<line x1="' + (cx - r) + '" y1="' + cy + '" x2="' + (cx + r) + '" y2="' + cy + '" stroke="rgba(58,37,22,0.15)" stroke-width="1"/>';

  // Data polygon
  var pts = [
    [cx, cy - (d / 100 * r)],
    [cx + (a / 100 * r), cy],
    [cx, cy + (m / 100 * r)],
    [cx - (c / 100 * r), cy]
  ];
  var pointsStr = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');

  gridHTML += '<polygon points="' + pointsStr + '" fill="url(#radarGrad)" stroke="url(#radarStroke)" stroke-width="2.5" opacity="0.9"/>';

  // Dots
  var colors = ['#3F8BC4', '#E5392A', '#3D9F47', '#F0BC2A'];
  pts.forEach(function(p, i) {
    gridHTML += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="' + colors[i] + '" stroke="#F1E6CB" stroke-width="2.5"/>';
  });

  svg.innerHTML = '<defs>' +
    '<linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" stop-color="rgba(63,139,196,0.18)"/>' +
    '<stop offset="33%" stop-color="rgba(229,57,42,0.12)"/>' +
    '<stop offset="66%" stop-color="rgba(61,159,71,0.18)"/>' +
    '<stop offset="100%" stop-color="rgba(240,188,42,0.14)"/>' +
    '</linearGradient>' +
    '<linearGradient id="radarStroke" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" stop-color="#3F8BC4"/>' +
    '<stop offset="33%" stop-color="#E5392A"/>' +
    '<stop offset="66%" stop-color="#3D9F47"/>' +
    '<stop offset="100%" stop-color="#F0BC2A"/>' +
    '</linearGradient>' +
    '</defs>' + gridHTML;
}
</script>
</body>
