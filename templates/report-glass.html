<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAMC — Hologram Glass Report</title>
<meta property="og:title" content="DAMC AI时代价值评估报告 — Hologram Glass">
<meta property="og:description" content="全息玻璃风格 AI 时代价值评估报告">
<meta name="description" content="DAMC 评估报告 — Hologram Glass Edition">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* === Custom property for holographic rotation === */
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --bg-deep: #080810;
    --bg-gradient: linear-gradient(135deg, #080810 0%, #0c1020 30%, #10081a 60%, #080810 100%);
    --glass: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-hover: rgba(255, 255, 255, 0.07);
    --text-primary: #f0f0f8;
    --text-secondary: #8888aa;
    --text-muted: #444466;
    --holo-1: #ff6ec7;
    --holo-2: #7b68ee;
    --holo-3: #00d4aa;
    --holo-4: #ffd700;
    --color-d: #4ecdc4;
    --color-a: #ff6b9d;
    --color-m: #c084fc;
    --color-c: #fbbf24;
    --color-d-dim: rgba(78, 205, 196, 0.12);
    --color-a-dim: rgba(255, 107, 157, 0.12);
    --color-m-dim: rgba(192, 132, 252, 0.12);
    --color-c-dim: rgba(251, 191, 36, 0.12);
    --glow-d: 0 0 20px rgba(78, 205, 196, 0.3);
    --glow-a: 0 0 20px rgba(255, 107, 157, 0.3);
    --glow-m: 0 0 20px rgba(192, 132, 252, 0.3);
    --glow-c: 0 0 20px rgba(251, 191, 36, 0.3);
    --radius: 20px;
    --radius-sm: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-deep);
    background-image: var(--bg-gradient);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    position: relative;
  }

  /* === Noise texture overlay === */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 9999;
  }

  /* === Floating orbs === */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.10;
    pointer-events: none;
    z-index: -1;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--color-d), transparent 70%);
    top: -10%; left: -5%;
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: 450px; height: 450px;
    background: radial-gradient(circle, var(--color-a), transparent 70%);
    top: 30%; right: -10%;
    animation: drift2 26s ease-in-out infinite alternate;
  }
  .orb-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, var(--color-m), transparent 70%);
    bottom: 10%; left: 10%;
    animation: drift3 20s ease-in-out infinite alternate;
  }
  .orb-4 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, var(--color-c), transparent 70%);
    bottom: -5%; right: 20%;
    animation: drift4 24s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(60px, 80px); }
  }
  @keyframes drift2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-70px, 50px); }
  }
  @keyframes drift3 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, -60px); }
  }
  @keyframes drift4 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-50px, -40px); }
  }

  /* === Glass base === */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    position: relative;
  }

  /* === Holographic shimmer border === */
  .holo-border {
    position: relative;
    z-index: 0;
  }
  .holo-border::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: conic-gradient(
      from var(--angle, 0deg),
      var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4), var(--holo-1)
    );
    z-index: -1;
    opacity: 0.25;
    animation: rotate-holo 8s linear infinite;
  }
  .holo-border::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--bg-deep);
    z-index: -1;
  }
  @keyframes rotate-holo {
    to { --angle: 360deg; }
  }

  /* === Holographic shimmer text === */
  .holo-text {
    background: linear-gradient(90deg, var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4), var(--holo-1));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer-text 4s linear infinite;
  }
  @keyframes shimmer-text {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* === Layout === */
  .container {
    max-width: 840px;
    margin: 0 auto;
    padding: 60px 28px 100px;
    position: relative;
    z-index: 1;
  }

  /* === Header === */
  .header {
    text-align: center;
    margin-bottom: 56px;
  }
  .header-title {
    font-family: 'Sora', sans-serif;
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .header-subtitle {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 17px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  .header-pills {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
  }

  /* === Archetype Hero === */
  .archetype {
    text-align: center;
    padding: 48px 40px;
    margin-bottom: 48px;
    overflow: hidden;
  }
  .archetype .emoji {
    font-size: 56px;
    display: block;
    margin-bottom: 16px;
    animation: float-emoji 4s ease-in-out infinite;
  }
  @keyframes float-emoji {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .archetype .name {
    font-family: 'Sora', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .archetype .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 520px;
    margin: 0 auto 32px;
    line-height: 1.8;
  }

  /* === Overall Score Ring === */
  .score-ring-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .score-ring-wrap {
    position: relative;
    width: 160px;
    height: 160px;
  }
  .score-ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .score-ring-track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.05);
    stroke-width: 6;
  }
  .score-ring-progress {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 408.41;
    stroke-dashoffset: 408.41;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .score-ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-ring-number {
    font-family: 'Sora', sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1;
  }
  .score-ring-unit {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .grade-pill {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 100px;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
  }

  /* === Radar Chart === */
  .radar-section {
    display: flex;
    justify-content: center;
    margin-bottom: 48px;
  }
  .radar-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .radar-label {
    position: absolute;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .radar-label .score {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    margin-top: 2px;
    opacity: 0.7;
  }
  .radar-label-d { top: -8px; left: 50%; transform: translateX(-50%); text-align: center; color: var(--color-d); }
  .radar-label-a { right: -56px; top: 50%; transform: translateY(-50%); text-align: left; color: var(--color-a); }
  .radar-label-m { bottom: -8px; left: 50%; transform: translateX(-50%); text-align: center; color: var(--color-m); }
  .radar-label-c { left: -56px; top: 50%; transform: translateY(-50%); text-align: right; color: var(--color-c); }

  /* === Section titles === */
  .section-title {
    font-family: 'Sora', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 24px;
    color: var(--text-primary);
  }

  /* === Dimension Score Cards === */
  .scores-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 48px;
  }
  .score-card {
    padding: 28px;
    overflow: hidden;
    position: relative;
  }
  .score-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 3px;
    border-radius: 0 3px 3px 0;
  }
  .score-card.card-d::after { background: var(--color-d); box-shadow: 0 0 20px rgba(78, 205, 196, 0.4); }
  .score-card.card-a::after { background: var(--color-a); box-shadow: 0 0 20px rgba(255, 107, 157, 0.4); }
  .score-card.card-m::after { background: var(--color-m); box-shadow: 0 0 20px rgba(192, 132, 252, 0.4); }
  .score-card.card-c::after { background: var(--color-c); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .dim-label {
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .dim-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .dim-name {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  /* Sub scores */
  .sub-score {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .sub-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    min-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 100px;
    overflow: hidden;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .bar-fill {
    height: 100%;
    border-radius: 100px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-d .bar-fill {
    background: linear-gradient(90deg, var(--color-d), rgba(78, 205, 196, 0.5));
    box-shadow: 0 0 8px rgba(78, 205, 196, 0.3);
  }
  .card-a .bar-fill {
    background: linear-gradient(90deg, var(--color-a), rgba(255, 107, 157, 0.5));
    box-shadow: 0 0 8px rgba(255, 107, 157, 0.3);
  }
  .card-m .bar-fill {
    background: linear-gradient(90deg, var(--color-m), rgba(192, 132, 252, 0.5));
    box-shadow: 0 0 8px rgba(192, 132, 252, 0.3);
  }
  .card-c .bar-fill {
    background: linear-gradient(90deg, var(--color-c), rgba(251, 191, 36, 0.5));
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
  }
  .sub-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    min-width: 24px;
    text-align: right;
  }

  /* === Scan Evidence === */
  .scan-evidence {
    margin-bottom: 48px;
  }
  .evidence-grid {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
  }
  .evidence-grid::-webkit-scrollbar { display: none; }
  .evidence-capsule {
    flex: 0 0 auto;
    min-width: 120px;
    padding: 20px 22px;
    text-align: center;
    border-radius: 16px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    transition: background 0.3s, border-color 0.3s;
  }
  .evidence-capsule:hover {
    background: var(--glass-hover);
    border-color: rgba(255, 255, 255, 0.12);
  }
  .ev-value {
    font-family: 'Sora', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .ev-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  /* === Insights === */
  .insights {
    margin-bottom: 48px;
  }
  .insight-group {
    padding: 24px 28px;
    margin-bottom: 16px;
    border-left: 3px solid transparent;
    border-radius: var(--radius-sm);
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
  }
  .insight-group.distill { border-left-color: var(--color-d); }
  .insight-group.moat { border-left-color: var(--color-a); }
  .insight-group.risk { border-left-color: #ff6b6b; }
  .insight-group.action { border-left-color: var(--color-m); }

  .insight-group h3 {
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text-primary);
  }
  .insight-group ul {
    list-style: none;
    padding: 0;
  }
  .insight-group li {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    padding: 6px 0 6px 22px;
    position: relative;
    line-height: 1.7;
  }
  .insight-group li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .insight-group.distill li::before { background: var(--color-d); box-shadow: var(--glow-d); }
  .insight-group.moat li::before { background: var(--color-a); box-shadow: var(--glow-a); }
  .insight-group.risk li::before { background: #ff6b6b; box-shadow: 0 0 20px rgba(255, 107, 107, 0.3); }
  .insight-group.action li::before { background: var(--color-m); box-shadow: var(--glow-m); }
  .insight-group.action li {
    color: var(--text-primary);
    font-weight: 500;
  }

  /* === Percentile === */
  .percentile-card {
    padding: 36px;
    text-align: center;
    margin-bottom: 48px;
  }
  .pct-title {
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .pct-overall {
    font-family: 'Sora', sans-serif;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }
  .pct-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 300;
    margin-top: 8px;
  }
  .pct-dims {
    display: flex;
    justify-content: center;
    gap: 36px;
    margin-top: 28px;
  }
  .pct-dim-item {
    text-align: center;
  }
  .pct-dim-label {
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .pct-dim-bar-track {
    width: 80px;
    height: 4px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 100px;
    overflow: hidden;
    margin: 0 auto 6px;
  }
  .pct-dim-bar-fill {
    height: 100%;
    border-radius: 100px;
    width: 0%;
    transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .pct-dim-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
  }

  /* === Share Card === */
  .share-section {
    text-align: center;
    margin-bottom: 48px;
  }
  .share-card {
    padding: 36px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .share-qr {
    width: 120px;
    height: 120px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 100px;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    z-index: 0;
    overflow: hidden;
  }
  .share-btn:hover {
    background: var(--glass-hover);
    border-color: rgba(255, 255, 255, 0.15);
  }
  .share-btn-holo {
    position: relative;
  }
  .share-btn-holo::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: conic-gradient(
      from var(--angle, 0deg),
      var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4), var(--holo-1)
    );
    z-index: -2;
    opacity: 0.4;
    animation: rotate-holo 6s linear infinite;
  }
  .share-btn-holo::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--bg-deep);
    z-index: -1;
  }

  /* === Footer === */
  .footer {
    text-align: center;
    padding-top: 40px;
    border-top: 1px solid var(--glass-border);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: var(--text-muted);
  }
  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer a:hover {
    color: var(--text-primary);
  }
  .footer .powered {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* === Responsive === */
  @media (max-width: 640px) {
    .container { padding: 32px 16px 60px; }
    .header-title { font-size: 36px; }
    .archetype .emoji { font-size: 40px; }
    .archetype .name { font-size: 24px; }
    .archetype { padding: 32px 20px; }
    .score-ring-wrap { width: 130px; height: 130px; }
    .score-ring-number { font-size: 38px; }
    .scores-grid { grid-template-columns: 1fr; }

(function() {
  const D = window.DAMC_DATA;
  if (!D) return;

  // Header pills
  const pillsContainer = document.getElementById('header-pills');
  const pillData = [D.userName, D.mbti, D.date].filter(Boolean);
  pillData.forEach(text => {
    const pill = document.createElement('span');
    pill.className = 'pill';

    pillsContainer.appendChild(pill);

  // Archetype
  document.getElementById('arch-emoji').textContent = D.archetype.emoji;

  document.getElementById('overall-num').textContent = D.overall;

  // Score Ring
  const ring = document.getElementById('score-ring');
  const circumference = 2 * Math.PI * 65; // ~408.41
  const offset = circumference - (D.overall / 100) * circumference;
  setTimeout(() => {
    ring.style.strokeDashoffset = offset;
  }, 300);

  // Grade
  const gradeEl = document.getElementById('overall-grade');
  let grade, gradeColor;
  if (D.overall >= 90) { grade = 'S'; gradeColor = var_to_hex('--color-m'); }
  else if (D.overall >= 75) { grade = 'A'; gradeColor = var_to_hex('--color-d'); }
  else if (D.overall >= 60) { grade = 'B'; gradeColor = var_to_hex('--color-c'); }
  else if (D.overall >= 45) { grade = 'C'; gradeColor = '#ff8844'; }
  else if (D.overall >= 30) { grade = 'D'; gradeColor = var_to_hex('--color-a'); }
  else { grade = 'F'; gradeColor = '#ff4444'; }
  gradeEl.textContent = 'Grade ' + grade;
  gradeEl.style.color = gradeColor;
  gradeEl.style.borderColor = gradeColor + '33';

  function var_to_hex(varName) {
    const map = {
      '--color-d': '#4ecdc4',
      '--color-a': '#ff6b9d',
      '--color-m': '#c084fc',
      '--color-c': '#fbbf24'
    };
    return map[varName] || '#f0f0f8';
  }

  // Radar labels
  document.getElementById('rl-d').textContent = D.scores.D.total;
  document.getElementById('rl-a').textContent = D.scores.A.total;
  document.getElementById('rl-m').textContent = D.scores.M.total;
  document.getElementById('rl-c').textContent = D.scores.C.total;

  // Draw radar
  drawRadar(D.scores.D.total, D.scores.A.total, D.scores.M.total, D.scores.C.total);

  // Score cards
  const grid = document.getElementById('scores-grid');
  const dims = [
    { key: 'D', label: 'DISTILL', name: '蒸馏价值', cls: 'card-d', color: 'var(--color-d)',
      subLabels: { expertise: '领域专精', methodology: '方法论', codifiability: '可编码性', standardization: '标准化', demand: '市场需求' } },
    { key: 'A', label: 'ANTI', name: '抗蒸馏指数', cls: 'card-a', color: 'var(--color-a)',
      subLabels: { creativity: '创造力', eq: '情商', crossDomain: '跨域综合', ambiguity: '模糊决策', physical: '身体在场', trust: '信任资产' } },
    { key: 'M', label: 'MASTERY', name: 'AI 驾驭能力', cls: 'card-m', color: 'var(--color-m)',
      subLabels: { environment: '环境配置', skills: 'Skill生态', automation: '自动化集成', memory: '记忆系统', advanced: '高级功能' } },
    { key: 'C', label: 'COMPASS', name: '职业适配', cls: 'card-c', color: 'var(--color-c)',
      subLabels: {} }
  ];

  dims.forEach((dim, i) => {
    const data = D.scores[dim.key];
    const card = document.createElement('div');
    card.className = 'score-card glass holo-border ' + dim.cls + ' animate-in delay-' + (i + 3);

    let subsHTML = '';
    const subs = data.subs || {};
    const maxSub = dim.key === 'M' ? 25 : 100;
    Object.keys(subs).forEach(k => {
      const label = dim.subLabels[k] || k;
      const val = subs[k];
      const pct = dim.key === 'M' ? Math.min(100, (val / maxSub) * 100) : val;
      subsHTML += '<div class="sub-score"><span class="sub-label" title="' + label + '">' + label + '</span><div class="bar-track"><div class="bar-fill" data-width="' + pct + '"></div></div><span class="sub-val">' + val + '</span></div>';
    });

    // C dimension: career paths
    if (dim.key === 'C' && data.fit) {
      subsHTML = '<div style="margin-top:4px;"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">适配方向: <strong style="color:var(--text-primary)">' + data.fit + '</strong></div>';
      if (data.paths) {
        data.paths.forEach(p => {
          subsHTML += '<div style="font-size:13px;color:var(--text-secondary);padding:5px 0 5px 20px;position:relative;"><span style="position:absolute;left:0;color:var(--color-c);">&#8594;</span> ' + p + '</div>';
        });
      }
      subsHTML += '</div>';
    }

    card.innerHTML = '<div class="card-header"><span class="dim-label">' + dim.label + '</span><span class="dim-score">' + data.total + '</span></div><div class="dim-name">' + dim.name + '</div>' + subsHTML;
    grid.appendChild(card);
  });

  // Scan evidence
  const evGrid = document.getElementById('evidence-grid');
  const evItems = [
    { key: 'totalSkills', label: 'Skills 总数' },
    { key: 'customSkills', label: '自建 Skills' },
    { key: 'hooksCount', label: 'Hooks 配置' },
    { key: 'mcpServers', label: 'MCP 服务器' },
    { key: 'memoryFiles', label: '记忆文件' },
    { key: 'claudeMdLines', label: 'CLAUDE.md 行数' },
    { key: 'aiCommits', label: 'AI 协作提交' },
    { key: 'totalCommits', label: '总提交数' }

  const scan = D.scanSummary || {};
  evItems.forEach(item => {
    const val = scan[item.key];
    if (val === undefined || val === null) return;
    const el = document.createElement('div');
    el.className = 'evidence-capsule';
    el.innerHTML = '<div class="ev-value">' + val + '</div><div class="ev-label">' + item.label + '</div>';
    evGrid.appendChild(el);

  // Insights
  const insContent = document.getElementById('insights-content');
  const ins = D.insights || {};
  const groups = [
    { key: 'distillTargets', title: '值得蒸馏的能力', icon: '\u{1F9EC}', cls: 'distill' },
    { key: 'moats', title: '你的护城河', icon: '\u{1F3F0}', cls: 'moat' },
    { key: 'risks', title: '风险预警', icon: '⚠️', cls: 'risk' },
    { key: 'actions', title: '行动建议', icon: '\u{1F680}', cls: 'action' }
  ];
  groups.forEach(g => {
    const items = ins[g.key];
    if (!items || items.length === 0) return;
    const div = document.createElement('div');
    div.className = 'insight-group ' + g.cls;
    div.innerHTML = '<h3>' + g.icon + ' ' + g.title + '</h3><ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    insContent.appendChild(div);
  });

  // Percentiles
  const pct = D.percentiles || {};
  if (pct.overall) {
    document.getElementById('pct-overall').textContent = 'Top ' + (100 - pct.overall) + '%';
    document.getElementById('pct-label').textContent = 'of AI-era professionals globally';
    const pctDims = document.getElementById('pct-dims');
    const dimColors = { D: '#4ecdc4', A: '#ff6b9d', M: '#c084fc', C: '#fbbf24' };
    const dimNames = { D: 'Distill', A: 'Anti', M: 'Mastery', C: 'Compass' };
    ['D','A','M','C'].forEach(k => {
      if (!pct[k]) return;
      const el = document.createElement('div');
      el.className = 'pct-dim-item';
      el.innerHTML = '<div class="pct-dim-label">' + dimNames[k] + '</div>' +
        '<div class="pct-dim-bar-track"><div class="pct-dim-bar-fill" data-width="' + pct[k] + '" style="background:' + dimColors[k] + ';box-shadow:0 0 8px ' + dimColors[k] + '66;"></div></div>' +
        '<div class="pct-dim-value" style="color:' + dimColors[k] + ';">' + pct[k] + '%</div>';
      pctDims.appendChild(el);
    });
  } else {
    document.getElementById('percentile-section').style.display = 'none';
  }

  // Share button
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', function() {
      const arch = D.archetype;
      const bar = (v) => { const filled = Math.round(v/10); return '█'.repeat(filled) + '░'.repeat(10-filled); };
      const text = [
        arch.emoji + ' ' + arch.name + ' — DAMC AI Era Assessment',
        '',
        'D ' + bar(D.scores.D.total) + ' ' + D.scores.D.total,
        'A ' + bar(D.scores.A.total) + ' ' + D.scores.A.total,
        'M ' + bar(D.scores.M.total) + ' ' + D.scores.M.total,
        'C ' + bar(D.scores.C.total) + ' ' + D.scores.C.total,
        '',
        'Overall: ' + D.overall + '/100 · ' + grade,
        pct.overall ? 'Top ' + (100 - pct.overall) + '% of AI-era builders' : '',
        '',
        'Know your worth → github.com/Jayden72Huang/DAMC',
        '#DAMC #AIEra #KnowYourWorth'
      ].filter(Boolean).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        shareBtn.querySelector('span').textContent = 'Copied!';
        setTimeout(() => { shareBtn.querySelector('span').textContent = 'Copy Share Card'; }, 2000);
      });
    });
  }

  // Date
  document.getElementById('gen-date').textContent = D.date;

  // Animate bars after delay
  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.width + '%';
    });
    document.querySelectorAll('.pct-dim-bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.width + '%';
    });
  }, 800);

})();

function drawRadar(d, a, m, c) {
  const svg = document.getElementById('radar');
  const cx = 150, cy = 150, r = 110;

  // Grid lines — subtle diamonds
  let gridHTML = '';
  [0.25, 0.5, 0.75, 1].forEach(scale => {
    const rr = r * scale;
    const points = [
      [cx, cy - rr],
      [cx + rr, cy],
      [cx, cy + rr],
      [cx - rr, cy]
    ].map(p => p.join(',')).join(' ');
    gridHTML += '<polygon points="' + points + '" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>';
  });

  // Axes
  gridHTML += '<line x1="' + cx + '" y1="' + (cy - r) + '" x2="' + cx + '" y2="' + (cy + r) + '" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>';
  gridHTML += '<line x1="' + (cx - r) + '" y1="' + cy + '" x2="' + (cx + r) + '" y2="' + cy + '" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>';

  // Data polygon
  const pts = [
    [cx, cy - (d / 100 * r)],
    [cx + (a / 100 * r), cy],
    [cx, cy + (m / 100 * r)],
    [cx - (c / 100 * r), cy]
  ];
  const pointsStr = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  gridHTML += '<polygon points="' + pointsStr + '" fill="url(#holoRadarFill)" stroke="url(#holoRadarStroke)" stroke-width="2" opacity="0.85"/>';

  // Glowing dots
  const colors = ['#4ecdc4', '#ff6b9d', '#c084fc', '#fbbf24'];
  pts.forEach((p, i) => {
    gridHTML += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="' + colors[i] + '" opacity="0.9"/>';
    gridHTML += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="10" fill="' + colors[i] + '" opacity="0.15"/>';
  });

  svg.innerHTML = '<defs>' +
